<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic English Mastery 🎓</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');

        :root {
            --primary: #1e3a8a; /* Deep Navy Blue */
            --secondary: #b45309; /* Elegant Bronze/Gold */
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --success: #059669;
            --success-bg: #ecfdf5;
            --error: #e11d48;
            --error-bg: #fff1f2;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: 
                radial-gradient(circle at 0% 0%, #e2e8f0 0%, transparent 20%),
                radial-gradient(circle at 100% 100%, #e2e8f0 0%, transparent 20%);
        }

        .game-container {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 850px;
            border-radius: 20px;
            box-shadow: 0 20px 40px -10px rgba(30, 58, 138, 0.1);
            padding: 40px;
            border-top: 6px solid var(--primary);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 800;
            font-size: 1.1em;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .badge-area { margin-bottom: 15px; text-align: center; }
        
        .badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .badge-mcq { background-color: #dbeafe; color: #1d4ed8; }
        .badge-fill { background-color: #fef3c7; color: #b45309; }

        .instruction {
            text-align: center;
            font-size: 1.15em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 20px;
        }

        .question-box {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-family: var(--font-heading);
            font-size: 1.6em;
            color: var(--primary);
            font-weight: 700;
            line-height: 1.5;
            background-color: #f8fafc;
        }

        .hint-text {
            display: block;
            margin-top: 15px;
            font-family: var(--font-body);
            font-size: 0.7em;
            color: var(--secondary);
            font-weight: 700;
            text-transform: none;
            letter-spacing: normal;
        }

        /* MCQ Styles */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 15px 20px;
            font-size: 1.15em;
            font-family: var(--font-body);
            color: var(--text-main);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            text-align: center;
        }

        .option-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.05);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background-color: #fef3c7;
            border-color: var(--secondary);
            color: #b45309;
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.1);
        }

        .option-btn.correct {
            background-color: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
            font-weight: 800;
        }

        .option-btn.wrong {
            background-color: var(--error-bg) !important;
            border-color: var(--error) !important;
            color: var(--error) !important;
            text-decoration: line-through;
        }

        /* Fill in Blank Styles */
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 60%;
            padding: 15px 20px;
            font-size: 1.3em;
            font-family: var(--font-body);
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            text-align: center;
            color: var(--primary);
            font-weight: 700;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 15px 50px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            display: block;
            margin: 0 auto;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #172554;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.2);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-next {
            background-color: var(--success);
            margin-top: 25px;
        }

        .btn-next:hover { background-color: #047857; }

        /* Explanation Box */
        .explanation-box {
            display: none;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 25px;
            margin-top: 25px;
            border-radius: 16px;
            color: var(--text-main);
            line-height: 1.6;
            animation: fadeIn 0.4s ease;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        .explanation-box.is-correct { border-left: 6px solid var(--success); }
        .explanation-box.is-wrong { border-left: 6px solid var(--error); }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #cbd5e1;
            font-size: 1.2em;
            font-weight: 800;
        }

        .audio-btn {
            background-color: var(--secondary);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .audio-btn:hover { background-color: #92400e; transform: scale(1.1); }

        .exp-content {
            background-color: var(--bg-body);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .exp-word {
            color: var(--primary);
            font-size: 1.5em;
            font-family: var(--font-heading);
            font-weight: 700;
        }

        .exp-ipa {
            color: var(--text-muted);
            font-family: monospace;
            background-color: #f1f5f9;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 10px;
            font-size: 0.9em;
        }

        .exp-meaning {
            display: block;
            margin: 10px 0;
            font-size: 1.1em;
            font-weight: 700;
        }

        .usage-box {
            background-color: #fffbeb;
            padding: 15px;
            border-left: 4px solid var(--secondary);
            border-radius: 8px;
            margin-top: 15px;
        }

        .example-box {
            background-color: #ffffff;
            padding: 15px;
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            margin-top: 15px;
            font-style: italic;
            border-top: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Result Screen */
        #result-screen { display: none; text-align: center; }
        #result-screen h2 { font-family: var(--font-heading); color: var(--primary); font-size: 2.5em; }
        .final-score { font-size: 4em; font-weight: 800; color: var(--secondary); margin: 20px 0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="game-container" id="quiz-screen">
        <div class="header">
            <span>📚 CÂU HỎI: <span id="current-question">1</span>/30</span>
            <span>🏆 ĐIỂM: <span id="score">0</span></span>
        </div>

        <div class="badge-area" id="badge-area"></div>
        <div class="instruction" id="instruction">Loading...</div>
        <div class="question-box" id="question">Loading...</div>
        
        <div id="dynamic-area"></div>
        <div class="explanation-box" id="explanation"></div>
        <button class="btn-primary btn-next" id="next-btn" onclick="nextQuestion()">Tiếp Tục ➔</button>
    </div>

    <div class="game-container" id="result-screen">
        <h2>Xin Chúc Mừng! 🎓</h2>
        <p style="font-size: 1.2em; color: var(--text-muted);">Bạn đã hoàn thành xuất sắc bài kiểm tra năng lực Tiếng Anh.</p>
        <div class="final-score"><span id="final-score"></span> / 300</div>
        <button class="btn-primary" onclick="restartGame()">Luyện Tập Lại 🔄</button>
    </div>

    <script>
        const quizData = [
            // MCQ (Single words)
            { type: "mcq", en: "placebo", ipa: "/pləˈsiːbəʊ/", vi: "thuốc giả dược", ex: "The doctor gave the patient a placebo to study the psychological effects.", usage: "Dùng để chỉ một chất hoặc phương pháp điều trị không có tác dụng y học thực sự (như viên đường), được dùng trong y khoa để trấn an bệnh nhân hoặc thử nghiệm." },
            { type: "mcq", en: "alleviate", ipa: "/əˈliːvieɪt/", vi: "làm giảm nhẹ, xoa dịu", ex: "The new drug helped alleviate her back pain.", usage: "Dùng khi làm cho một nỗi đau, hoặc một vấn đề trở nên bớt nghiêm trọng hơn (giảm đau, giảm nghèo)." },
            { type: "mcq", en: "prescription", ipa: "/prɪˈskrɪpʃn/", vi: "đơn thuốc", ex: "The pharmacy refused to sell the medicine without a prescription.", usage: "Mệnh lệnh bằng văn bản của bác sĩ về loại thuốc mà bệnh nhân cần dùng." },
            { type: "mcq", en: "ailment", ipa: "/ˈeɪlmənt/", vi: "bệnh tật (nhẹ)", ex: "He went to the clinic to treat a minor ailment.", usage: "Một căn bệnh, đặc biệt là bệnh không quá nghiêm trọng hoặc mãn tính." },
            { type: "mcq", en: "substantiate", ipa: "/səbˈstænʃɪeɪt/", vi: "chứng minh, xác nhận", ex: "The lawyer could not substantiate his client's claims with evidence.", usage: "Cung cấp thông tin hoặc bằng chứng để chứng minh điều gì đó là đúng sự thật." },
            { type: "mcq", en: "violate", ipa: "/ˈvaɪəleɪt/", vi: "vi phạm", ex: "The company was fined for violating environmental laws.", usage: "Có hành động đi ngược lại, phá vỡ luật lệ, thỏa thuận hoặc nguyên tắc." },
            { type: "mcq", en: "paramount", ipa: "/ˈpærəmaʊnt/", vi: "tối quan trọng", ex: "Patient safety is of paramount importance.", usage: "Quan trọng hơn bất cứ thứ gì khác, mang tính tối cao." },
            { type: "mcq", en: "exacerbate", ipa: "/ɪɡˈzæsərbeɪt/", vi: "làm trầm trọng thêm", ex: "Lack of treatment will only exacerbate the disease.", usage: "Làm cho một vấn đề, căn bệnh hoặc tình huống xấu trở nên tồi tệ hơn (trái nghĩa với alleviate)." },
            { type: "mcq", en: "consent", ipa: "/kənˈsent/", vi: "sự đồng ý", ex: "Patients must give informed consent before surgery.", usage: "Sự cho phép chính thức để một việc gì đó được diễn ra, thường dùng trong pháp lý và y tế." },
            { type: "mcq", en: "inherit", ipa: "/ɪnˈherɪt/", vi: "thừa kế", ex: "She inherited a large house from her parents.", usage: "Nhận tiền, tài sản, hoặc đặc điểm di truyền từ người đi trước (thường là sau khi họ mất)." },
            { type: "mcq", en: "asset", ipa: "/ˈæset/", vi: "tài sản, lợi thế", ex: "Honesty is his greatest asset.", usage: "Chỉ tài sản có giá trị (tiền bạc, đất đai) hoặc một ưu điểm, kỹ năng quý giá của một người." },
            { type: "mcq", en: "amend", ipa: "/əˈmend/", vi: "sửa đổi (văn bản, luật)", ex: "The contract was amended to include additional terms.", usage: "Chỉnh sửa, thay đổi một tài liệu, hợp đồng, hoặc đạo luật để cập nhật hoặc làm cho nó tốt hơn." },
            { type: "mcq", en: "eschew", ipa: "/ɪsˈtʃuː/", vi: "tránh, kiêng", ex: "He eschewed alcohol for health reasons.", usage: "Cố ý xa lánh, từ bỏ hoặc tránh làm một việc gì đó (thường vì lý do đạo đức hoặc sức khỏe)." },
            { type: "mcq", en: "aspire", ipa: "/əˈspaɪər/", vi: "khao khát, mong muốn", ex: "She aspires to become a doctor.", usage: "Có tham vọng mạnh mẽ để đạt được điều gì đó vĩ đại trong sự nghiệp hoặc cuộc sống." },
            { type: "mcq", en: "deter", ipa: "/dɪˈtɜːr/", vi: "ngăn cản, răn đe", ex: "Security cameras help deter crime.", usage: "Làm cho ai đó từ bỏ ý định làm việc gì đó (thường là việc xấu) bằng cách đe dọa hậu quả." },
            { type: "mcq", en: "bombard", ipa: "/bɒmˈbɑːd/", vi: "dồn dập, tấn công", ex: "Reporters bombarded the minister with questions.", usage: "Tấn công liên tục bằng vũ khí, hoặc (nghĩa bóng) dồn dập đưa ra câu hỏi, quảng cáo, chỉ trích hướng vào ai đó." },
            { type: "mcq", en: "disposable", ipa: "/dɪˈspəʊzəbl/", vi: "dùng một lần, vứt đi được", ex: "The hospital provides disposable gloves for all staff.", usage: "Các sản phẩm được thiết kế để vứt đi sau khi sử dụng một lần (cốc giấy, dao cạo râu, tã)." },

            // FILL IN THE BLANK (Idioms)
            { type: "fill", ans: "gloss", full: "gloss over", ipa: "/ɡlɒs ˈəʊvə(r)/", phrase: "________ over", vi: "che đậy, làm nhẹ vấn đề", ex: "The report tried to gloss over the company's mistakes.", usage: "Dùng khi cố ý phớt lờ, giải thích qua loa hoặc nói giảm nói tránh một vấn đề nghiêm trọng/sai lầm để nó có vẻ bớt tồi tệ hơn." },
            { type: "fill", ans: "worse", full: "take a turn for the worse", ipa: "/teɪk ə tɜːrn fər ðə wɜːrs/", phrase: "take a turn for the ________", vi: "trở nên tệ hơn", ex: "After the surgery, his health suddenly took a turn for the worse.", usage: "Thành ngữ dùng khi tình hình (thường là sức khỏe, thời tiết hoặc tài chính) đột ngột diễn biến theo chiều hướng xấu đi." },
            { type: "fill", ans: "align", full: "align with", ipa: "/əˈlaɪn wɪð/", phrase: "________ with", vi: "phù hợp, tương thích với", ex: "The company's goals align with its environmental responsibilities.", usage: "Dùng khi các quan điểm, chính sách, mục tiêu, hoặc hành động hoàn toàn thống nhất, đi cùng hướng với nhau." },
            { type: "fill", ans: "rocket", full: "rocket science", ipa: "/ˈrɒkɪt saɪəns/", phrase: "________ science", vi: "điều gì đó rất khó", ex: "Making a simple website isn't rocket science.", usage: "Thành ngữ thường dùng ở dạng phủ định 'It is not rocket science' để trấn an rằng một việc gì đó thực ra rất dễ hiểu, không phức tạp như chế tạo tên lửa." },
            { type: "fill", ans: "beaten", full: "the beaten track", ipa: "/ðə ˈbiːtn træk/", phrase: "the ________ track", vi: "lối mòn, nơi phổ biến", ex: "They wanted to travel off the beaten track in rural Asia.", usage: "Thường đi kèm giới từ 'off' -> 'off the beaten track', dùng để chỉ những nơi hoang sơ, hẻo lánh, ít người biết đến và ít khách du lịch." },
            
            { type: "fill", ans: "suit", full: "follow suit", ipa: "/ˌfɒləʊ ˈsuːt/", phrase: "follow ________", vi: "làm theo, bắt chước", ex: "When one airline reduced its prices, the others immediately followed suit.", usage: "Thành ngữ bắt nguồn từ trò chơi bài, nghĩa bóng là làm hành động tương tự như người khác vừa làm." },
            { type: "fill", ans: "reason", full: "it stands to reason", ipa: "/ɪt stændz tə ˈriːzn/", phrase: "it stands to ________", vi: "rõ ràng là, hợp logic", ex: "If you don't study, it stands to reason that you won't pass the exam.", usage: "Dùng để nhấn mạnh một hệ quả vô cùng hợp lý, hiển nhiên và dễ hiểu dựa trên các sự kiện đã có." },
            { type: "fill", ans: "ropes", full: "know the ropes", ipa: "/nəʊ ðə rəʊps/", phrase: "know the ________", vi: "nắm vững tình hình, thạo việc", ex: "Ask John for help; he has worked here for years and knows the ropes.", usage: "✔️ <b>Know the ropes:</b> Nắm vững tình hình, thạo việc, rành rẽ cách hoạt động của một hệ thống/công việc.<br><br>✔️ <b>Learn the ropes:</b> Đang trong quá trình học việc, làm quen với công việc hoặc môi trường mới." },
            { type: "fill", ans: "waste", full: "lay something waste", ipa: "/leɪ weɪst/", phrase: "lay something ________", vi: "tàn phá, hủy hoại", ex: "The invading army laid waste to the entire city.", usage: "Cụm từ trang trọng, nghĩa là phá hủy hoàn toàn một khu vực, vùng đất hoặc công trình nào đó." },
            { type: "fill", ans: "tricks", full: "play tricks on someone", ipa: "/pleɪ trɪks ɒn/", phrase: "play ________ on someone", vi: "trêu chọc, chơi khăm", ex: "The older boys used to play tricks on him.", usage: "Trêu đùa, lừa phỉnh hoặc chơi khăm ai đó một cách tinh nghịch hoặc ác ý." },
            { type: "fill", ans: "scorn", full: "pour scorn on", ipa: "/pɔː(r) skɔːn ɒn/", phrase: "pour ________ on", vi: "chê bai, dè bỉu", ex: "Critics poured scorn on the director's new movie.", usage: "Thể hiện sự khinh thường sâu sắc, chỉ trích gay gắt đối với ai/cái gì ở nơi công cộng." },
            { type: "fill", ans: "together", full: "pull oneself together", ipa: "/pʊl wʌnz ˈself təˈɡeðə(r)/", phrase: "pull oneself ________", vi: "lấy lại bình tĩnh", ex: "Stop crying and pull yourself together!", usage: "Câu mệnh lệnh khuyên ai đó nên kiểm soát lại cảm xúc sau khi hoảng loạn, tức giận hoặc buồn bã." },
            { type: "fill", ans: "ground", full: "stand one's ground", ipa: "/stænd wʌnz ɡraʊnd/", phrase: "stand one's ________", vi: "giữ vững lập trường", ex: "Despite the pressure, she stood her ground and refused to sign the contract.", usage: "Không chịu lùi bước, kiên định bảo vệ ý kiến/vị trí của mình dù bị phản đối hay đe dọa." },
            { type: "fill", ans: "liberties", full: "take liberties with", ipa: "/teɪk ˈlɪbətiz wɪð/", phrase: "take ________ with", vi: "tự tiện, lạm dụng quyền", ex: "He tends to take liberties with the company's rules.", usage: "Tự ý làm những việc vượt quá giới hạn cho phép, tỏ ra quá suồng sã với người khác, hoặc thay đổi quy định một cách tùy tiện." },
            { type: "fill", ans: "ear", full: "bend someone's ear", ipa: "/bend wʌnz ɪə(r)/", phrase: "bend someone's ________", vi: "lải nhải, nói chuyện dài dòng", ex: "He bent my ear for an hour about his new car.", usage: "Nói liên tục, lải nhải vào tai người khác về một vấn đề khiến họ cảm thấy mệt mỏi hoặc chán nản." }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionText = null;
        let selectedOptionBtn = null;

        const questionEl = document.getElementById("question");
        const dynamicAreaEl = document.getElementById("dynamic-area");
        const explanationEl = document.getElementById("explanation");
        const nextBtn = document.getElementById("next-btn");
        const scoreEl = document.getElementById("score");
        const currentQEl = document.getElementById("current-question");
        const badgeAreaEl = document.getElementById("badge-area");
        const instructionEl = document.getElementById("instruction");

        // Audio Setup
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(isCorrect) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (isCorrect) {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime); 
                oscillator.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.1); 
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(250, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            }
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        // TTS Filtering
        function cleanTextForSpeech(text) {
            return text.replace(/\bsomeone\b|\bsomething\b|\bsb\b|\bsth\b|\bone's\b/gi, '')
                       .replace(/\s+/g, ' ')
                       .trim();
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = cleanTextForSpeech(text);
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-GB'; 
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Global Enter Key
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const resultScreen = document.getElementById("result-screen");
                if (resultScreen.style.display === "block") return;

                if (nextBtn.style.display === "block") {
                    event.preventDefault();
                    nextQuestion();
                } else {
                    const submitBtn = document.getElementById("submit-btn");
                    if (submitBtn && submitBtn.style.display !== "none" && !submitBtn.disabled) {
                        event.preventDefault();
                        currentQuestions[currentQuestionIndex].type === "mcq" ? checkMCQ() : checkFill();
                    }
                }
            }
        });

        function initGame() {
            document.body.addEventListener('click', initAudio, { once: true });
            currentQuestions = [...quizData].sort(() => Math.random() - 0.5).slice(0, 30);
            currentQuestionIndex = 0;
            score = 0;
            scoreEl.innerText = score;
            document.getElementById("quiz-screen").style.display = "block";
            document.getElementById("result-screen").style.display = "none";
            loadQuestion();
        }

        function getRandomDistractors(correctWord, count = 3) {
            const allMcq = quizData.filter(v => v.type === 'mcq').map(v => v.en);
            const distractors = allMcq.filter(w => w !== correctWord);
            return distractors.sort(() => Math.random() - 0.5).slice(0, count);
        }

        function loadQuestion() {
            nextBtn.style.display = "none";
            explanationEl.style.display = "none";
            dynamicAreaEl.innerHTML = "";
            selectedOptionText = null;
            selectedOptionBtn = null;
            
            const item = currentQuestions[currentQuestionIndex];
            currentQEl.innerText = currentQuestionIndex + 1;

            if (item.type === "mcq") {
                badgeAreaEl.innerHTML = `<span class="badge badge-mcq">TỪ VỰNG (MCQ)</span>`;
                instructionEl.innerText = "Chọn từ tiếng Anh có nghĩa là:";
                questionEl.innerHTML = `"${item.vi}"`;

                const distractors = getRandomDistractors(item.en, 3);
                let opts = [item.en, ...distractors].sort(() => Math.random() - 0.5);

                const optionsContainer = document.createElement('div');
                optionsContainer.className = "options-grid";
                
                opts.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerText = opt;
                    btn.onclick = () => {
                        initAudio();
                        const allBtns = optionsContainer.querySelectorAll('.option-btn');
                        allBtns.forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedOptionText = opt;
                        selectedOptionBtn = btn;
                        
                        const submitBtn = document.getElementById("submit-btn");
                        if(submitBtn) {
                            submitBtn.disabled = false;
                        }
                    };
                    optionsContainer.appendChild(btn);
                });
                dynamicAreaEl.appendChild(optionsContainer);
                
                const submitDiv = document.createElement('div');
                submitDiv.innerHTML = `<button class="btn-primary" id="submit-btn" onclick="checkMCQ()" disabled>Kiểm tra</button>`;
                dynamicAreaEl.appendChild(submitDiv);

            } else {
                badgeAreaEl.innerHTML = `<span class="badge badge-fill">THÀNH NGỮ (ĐIỀN TỪ)</span>`;
                instructionEl.innerText = "Điền MỘT từ vào chỗ trống để tạo thành Idiom hoàn chỉnh:";
                
                const formattedQ = item.phrase.replace("________", `<span style="color: var(--text-muted); border-bottom: 2px dashed var(--text-muted); padding: 0 30px;">?</span>`);
                questionEl.innerHTML = `${formattedQ} <span class="hint-text">💡 Nghĩa: ${item.vi}</span>`;

                dynamicAreaEl.innerHTML = `
                    <div class="input-group">
                        <input type="text" id="blank-input" placeholder="Gõ từ cần điền..." autocomplete="off">
                        <button class="btn-primary" id="submit-btn" onclick="checkFill()">Kiểm tra</button>
                    </div>
                `;
                setTimeout(() => {
                    const inp = document.getElementById("blank-input");
                    if(inp) inp.focus();
                }, 100);
            }
        }

        function checkMCQ() {
            if (!selectedOptionText) return;

            initAudio();
            const item = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => btn.disabled = true);
            document.getElementById("submit-btn").style.display = "none";

            let isCorrect = selectedOptionText === item.en;
            let headerHTML = "";

            if (isCorrect) {
                selectedOptionBtn.classList.remove("selected");
                selectedOptionBtn.classList.add("correct");
                score += 10;
                scoreEl.innerText = score;
                playSound(true);
                explanationEl.className = "explanation-box is-correct";
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--success);">✓ Chính xác!</span>
                        <button class='audio-btn' onclick="speakWord('${item.en.replace(/'/g, "\\'")}')">🔊</button>
                    </div>`;
            } else {
                selectedOptionBtn.classList.remove("selected");
                selectedOptionBtn.classList.add("wrong");
                buttons.forEach(btn => {
                    if(btn.innerText === item.en) btn.classList.add("correct");
                });
                playSound(false);
                explanationEl.className = "explanation-box is-wrong";
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--error);">✗ Đáp án đúng: <b>${item.en}</b></span>
                        <button class='audio-btn' onclick="speakWord('${item.en.replace(/'/g, "\\'")}')">🔊</button>
                    </div>`;
            }

            speakWord(item.en);

            const expHTML = `
                ${headerHTML}
                <div class='exp-content'>
                    <span class='exp-word'>${item.en}</span> <span class='exp-ipa'>${item.ipa}</span>
                    <div class="usage-box">
                        <b>Giải thích:</b> ${item.distractor}
                    </div>
                    <div class="example-box">
                        ${item.ex}
                    </div>
                </div>
            `;
            
            explanationEl.innerHTML = expHTML;
            explanationEl.style.display = "block";
            nextBtn.style.display = "block";
            setTimeout(() => { nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        }

        function checkFill() {
            initAudio();
            const item = currentQuestions[currentQuestionIndex];
            const inputEl = document.getElementById("blank-input");
            const submitBtn = document.getElementById("submit-btn");

            const userAns = inputEl.value.trim().toLowerCase();
            const correctAns = item.ans.toLowerCase();

            if (userAns === "") return;

            inputEl.disabled = true;
            submitBtn.style.display = "none";

            let isCorrect = userAns === correctAns;
            let headerHTML = "";

            if (isCorrect) {
                score += 10;
                scoreEl.innerText = score;
                playSound(true);
                explanationEl.className = "explanation-box is-correct";
                questionEl.innerHTML = item.phrase.replace("________", `<span style="color: var(--success); border-bottom: 2px solid var(--success); padding: 0 10px;">${item.ans}</span>`);
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--success);">✓ Giỏi quá!</span>
                        <button class='audio-btn' onclick="speakWord('${item.full.replace(/'/g, "\\'")}')">🔊</button>
                    </div>`;
            } else {
                playSound(false);
                explanationEl.className = "explanation-box is-wrong";
                questionEl.innerHTML = item.phrase.replace("________", `<span style="color: var(--error); text-decoration: line-through;">${userAns}</span> <span style="color: var(--success);">${item.ans}</span>`);
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--error);">✗ Từ cần điền là: <b>${item.ans}</b></span>
                        <button class='audio-btn' onclick="speakWord('${item.full.replace(/'/g, "\\'")}')">🔊</button>
                    </div>`;
            }

            speakWord(item.full);

            const expHTML = `
                ${headerHTML}
                <div class='exp-content'>
                    <span class='exp-word'>${item.full}</span> <span class='exp-ipa'>${item.ipa}</span>
                    <span class='exp-meaning'>Nghĩa: ${item.vi}</span>
                    <div class="usage-box">
                        <b>Cách dùng:</b> ${item.usage}
                    </div>
                    <div class="example-box">
                        <b>Ví dụ:</b> "${item.ex}"
                    </div>
                </div>
            `;
            
            explanationEl.innerHTML = expHTML;
            explanationEl.style.display = "block";
            nextBtn.style.display = "block";
            setTimeout(() => { nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById("quiz-screen").style.display = "none";
                document.getElementById("result-screen").style.display = "block";
                document.getElementById("final-score").innerText = score;
            }
        }

        function restartGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
