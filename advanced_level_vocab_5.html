<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idiom & Collocation Mastery 🎓 - Fill in the Blanks</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;800&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #334155;
        }

        .quiz-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 750px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            padding: 40px;
            border: 1px solid #e2e8f0;
            text-align: center;
            transition: all 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: #0f766e;
            font-weight: 800;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .instruction {
            font-size: 1.2em;
            color: #0f766e;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .hint-box {
            background-color: #f0fdfa;
            border-left: 4px solid #14b8a6;
            padding: 15px 20px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 25px;
            font-family: 'Lora', serif;
            font-size: 1.2em;
            color: #0f766e;
            text-align: left;
            font-style: italic;
        }

        .question-box {
            margin: 0 0 30px 0;
            font-size: 1.6em;
            color: #1e293b;
            font-weight: 600;
            line-height: 1.6;
            text-align: left;
        }

        /* Input Area */
        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 70%;
            padding: 16px 20px;
            font-size: 1.4em;
            font-family: inherit;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            text-align: center;
            color: #0f766e;
            font-weight: 700;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input[type="text"]:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.1);
        }

        .submit-btn {
            background-color: #0f766e;
            color: #fff;
            border: none;
            padding: 16px 50px;
            font-size: 1.3em;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(15, 118, 110, 0.3);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background-color: #115e59;
            box-shadow: 0 6px 20px rgba(15, 118, 110, 0.4);
        }

        .submit-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(15, 118, 110, 0.3);
        }

        /* Explanation Box */
        .explanation-box {
            display: none;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 25px;
            border-radius: 16px;
            color: #334155;
            font-size: 1.1em;
            line-height: 1.6;
            text-align: left;
            animation: fadeIn 0.5s ease;
        }

        .exp-header {
            display: flex;
            align-items: center;
            font-size: 1.3em;
            font-weight: 800;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .encouragement {
            font-size: 1em;
            font-weight: 600;
            color: #b91c1c;
            margin-bottom: 15px;
            display: block;
            font-style: italic;
        }

        .correct-text { color: #10b981; }
        .wrong-text { color: #ef4444; }
        
        .exp-detail strong {
            color: #0f766e;
            font-family: 'Lora', serif;
            font-size: 1.2em;
        }

        .exp-usage {
            margin-top: 15px;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
            font-size: 0.95em;
        }

        .next-btn {
            background-color: #3b82f6;
            color: #fff;
            border: none;
            padding: 16px 35px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 800;
            font-family: inherit;
            transition: all 0.3s ease;
            display: none;
            margin: 25px auto 0 auto;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            background-color: #2563eb;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        #result-screen {
            display: none;
        }

        #result-screen h2 {
            color: #0f766e;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-family: 'Lora', serif;
        }

        .restart-btn {
            background-color: #3b82f6;
            color: #fff;
            border: none;
            padding: 16px 40px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 800;
            margin-top: 30px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-screen">
        <div class="header">
            <span>📚 CÂU HỎI: <span id="current-question">1</span>/21</span>
            <span>🎯 ĐIỂM: <span id="score">0</span></span>
        </div>
        
        <div class="instruction">Điền MỘT từ tiếng Anh vào chỗ trống:</div>

        <div class="hint-box" id="hint">
            💡 Nghĩa: Loading...
        </div>

        <div class="question-box" id="question">Loading...</div>
        
        <div class="input-area" id="dynamic-area">
            <!-- Input will be injected here -->
        </div>

        <div class="explanation-box" id="explanation"></div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Tiếp tục ➔</button>
    </div>

    <div class="quiz-container" id="result-screen">
        <h2>Hoàn Thành Xuất Sắc!</h2>
        <p style="font-size: 1.2em; color: #64748b; margin-bottom: 30px;">Bạn đã hoàn thành bài tập tự điền từ Idiom & Collocation.</p>
        <p style="font-size: 1.2em; font-weight: 600; color: #334155;">Tổng điểm của bạn:</p>
        <div style="font-size: 3.5em; font-weight: 800; color: #0f766e; margin: 10px 0;"><span id="final-score"></span> / 210</div>
        <button class="restart-btn" onclick="restartGame()">Ôn tập lại 🔄</button>
    </div>

    <script>
        const quizData = [
            // Từ file ảnh 1 (14 câu)
            {
                q: "We took such a great ________ to the place that we decided to go and live there.",
                ans: "liking",
                idiom: "take a liking to sth/sb",
                vi: "bắt đầu thích cái gì/ai đó",
                usage: "Dùng khi bạn nảy sinh tình cảm, sự yêu thích với một nơi, một người hay một vật sau một thời gian tiếp xúc. Ngữ cảnh: Thấy nơi này quá tuyệt nên quyết định chuyển đến sống luôn."
            },
            {
                q: "In the ________ of demand for tickets, it has been decided that an extra performance will be staged.",
                ans: "light",
                idiom: "in the light of sth",
                vi: "bởi vì, xét đến (những thông tin, tình huống mới)",
                usage: "Thường dùng trong các quyết định mang tính chính thức. Ngữ cảnh: Xét thấy nhu cầu mua vé quá lớn, ban tổ chức đã quyết định diễn thêm một buổi nữa."
            },
            {
                q: "She works very hard and finds it difficult to ________ off when she gets home.",
                ans: "switch",
                idiom: "switch off",
                vi: "ngừng suy nghĩ về công việc, thư giãn",
                usage: "Được dùng rất phổ biến trong giao tiếp để chỉ việc tắt chế độ 'làm việc' trong não bộ để nghỉ ngơi. Ngữ cảnh: Làm việc quá chăm chỉ nên khi về nhà cô ấy khó mà xả hơi được."
            },
            {
                q: "I was worried but their reassurances put my mind at ________.",
                ans: "rest",
                idiom: "put one's mind at rest",
                vi: "làm cho ai đó bớt lo lắng, cảm thấy an tâm",
                usage: "Dùng khi muốn khuyên nhủ, an ủi ai đó. Ngữ cảnh: Nhờ những lời trấn an của họ mà tôi đã trút bỏ được sự lo lắng."
            },
            {
                q: "By the ________ of it, the economy will improve over the next few months.",
                ans: "look",
                idiom: "by the look of it",
                vi: "vẻ bề ngoài, qua những gì thấy được",
                usage: "Dùng để đưa ra phán đoán dựa trên những bằng chứng hoặc tình hình hiện tại. Ngữ cảnh: Nhìn vào tình hình hiện tại, nền kinh tế sẽ khởi sắc."
            },
            {
                q: "His amazing natural skills set him ________ from most other players.",
                ans: "apart",
                idiom: "set sb apart from sb/sth",
                vi: "làm cho ai đó trở nên khác biệt, xuất chúng hơn",
                usage: "Dùng để ngợi khen một đặc điểm nổi trội khiến một người/vật tách biệt hẳn với phần còn lại. Ngữ cảnh: Kỹ năng thiên phú làm anh ấy nổi bật hơn hẳn các cầu thủ khác."
            },
            {
                q: "Harriet has now arrived late for work three days in a ________.",
                ans: "row",
                idiom: "in a row",
                vi: "liên tiếp, liền nhau",
                usage: "Cụm từ rất thông dụng để diễn tả sự việc lặp đi lặp lại không ngắt quãng. Ngữ cảnh: Harriet đã đi làm muộn 3 ngày liên tiếp."
            },
            {
                q: "All the others were experts and I was out of my ________ in the conversation.",
                ans: "depth",
                idiom: "out of one's depth",
                vi: "vượt quá khả năng hiểu biết hoặc kiểm soát",
                usage: "Nghĩa đen là 'vượt quá mực nước có thể đứng', nghĩa bóng là không đủ kiến thức/khả năng cho một việc gì. Ngữ cảnh: Ai cũng là chuyên gia, tôi hoàn toàn không hiểu họ đang nói gì."
            },
            {
                q: "I'll have to call a ________ to this discussion, as we have a lot of work to do.",
                ans: "halt",
                idiom: "call a halt to sth",
                vi: "yêu cầu dừng lại việc gì đó",
                usage: "Dùng mang tính quyết định, ra lệnh kết thúc một hành động (cuộc họp, thảo luận, tranh cãi). Ngữ cảnh: Phải dừng cuộc thảo luận ở đây thôi vì còn quá nhiều việc phải làm."
            },
            {
                q: "The thieves took ________ when they heard a police car approaching.",
                ans: "flight",
                idiom: "take flight",
                vi: "bỏ chạy, chạy trốn",
                usage: "Thường dùng trong văn cảnh kịch tính khi ai đó bỏ chạy vì sợ hãi. Ngữ cảnh: Bọn trộm co giò bỏ chạy khi nghe tiếng xe cảnh sát."
            },
            {
                q: "After working twelve hours straight without a pause, Sarah was clearly running on ________.",
                ans: "empty",
                idiom: "run on empty",
                vi: "kiệt sức nhưng vẫn cố gắng tiếp tục",
                usage: "Hình ảnh ẩn dụ từ chiếc xe đã cạn bình xăng nhưng vẫn chạy. Ngữ cảnh: Làm việc 12 tiếng không nghỉ, Sarah đã hoàn toàn cạn kiệt năng lượng."
            },
            {
                q: "We all have to follow the rules, and none of us is ________ the law.",
                ans: "above",
                idiom: "above the law",
                vi: "đứng trên pháp luật, ngoại lệ của pháp luật",
                usage: "Cụm từ cố định mang tính pháp lý hoặc đạo đức. Ngữ cảnh: Bất kể là ai cũng phải tuân thủ quy định, không ai được phép đứng trên luật pháp."
            },
            {
                q: "I tried to push my way through the standing passengers to get to the door and, failing to keep my ________ about me.",
                ans: "wits",
                idiom: "keep one's wits about one",
                vi: "giữ bình tĩnh và tỉnh táo trong tình huống khó khăn",
                usage: "Dùng khi bạn cần phản ứng nhanh, tỉnh táo trong tình huống hỗn loạn. Ngữ cảnh: Cố chen qua đám đông hành khách nhưng tôi đã không giữ được sự tỉnh táo."
            },
            {
                q: "When his manager went on a business trip, Smith stepped into the ________ and chaired the meeting.",
                ans: "breach",
                idiom: "step into the breach",
                vi: "thay thế ai đó làm việc gì khi họ vắng mặt",
                usage: "Bắt nguồn từ quân sự (bước vào lỗ hổng phòng tuyến), nay dùng để chỉ việc làm thay công việc của ai đó đang vắng mặt. Ngữ cảnh: Quản lý đi vắng, Smith đã đứng ra thay thế và chủ trì cuộc họp."
            },

            // Từ file ảnh 2 (7 câu)
            {
                q: "The police found the suspect in ________ of illegal drugs.",
                ans: "possession",
                idiom: "in possession of sth",
                vi: "sở hữu, có trong tay cái gì",
                usage: "Cụm từ trang trọng, thường dùng trong báo chí, luật pháp. Ngữ cảnh: Cảnh sát phát hiện nghi phạm đang tàng trữ (sở hữu) ma túy trái phép."
            },
            {
                q: "His incredible recovery after the terrible accident was nothing ________ of a miracle.",
                ans: "short",
                idiom: "nothing short of sth",
                vi: "không khác gì, hoàn toàn phải là (nhấn mạnh)",
                usage: "Dùng để nhấn mạnh sự kinh ngạc, vĩ đại của một sự việc. Ngữ cảnh: Sự hồi phục kỳ diệu của anh ấy sau tai nạn thảm khốc quả thật không khác gì một phép màu."
            },
            {
                q: "I'm sure I can ________ up a quick meal if you are hungry right now.",
                ans: "rustle",
                idiom: "rustle sth up",
                vi: "nấu nhanh, chuẩn bị nhanh một bữa ăn (với những gì có sẵn)",
                usage: "Cụm từ giao tiếp thân mật. Từ đồng nghĩa: whip sth up. Ngữ cảnh: Tôi có thể dọn nhanh một bữa ăn nhẹ nếu bạn đang thấy đói."
            },
            {
                q: "We should launch the new marketing campaign now while the time is ________.",
                ans: "ripe",
                idiom: "the time is ripe (for sth)",
                vi: "thời cơ đã chín muồi, thời điểm thích hợp nhất",
                usage: "Dùng khi mọi điều kiện đều đã thuận lợi để bắt đầu làm một việc gì đó. Ngữ cảnh: Đã đến thời điểm vàng để tung ra chiến dịch tiếp thị mới."
            },
            {
                q: "I had the good ________ to work with some of the best directors in the film industry.",
                ans: "fortune",
                idiom: "have the good fortune to do sth",
                vi: "có may mắn, gặp may mắn khi được làm gì",
                usage: "Cách diễn đạt lịch sự và trang trọng hơn của từ 'lucky'. Ngữ cảnh: Tôi đã có diễm phúc được làm việc chung với những đạo diễn tài năng nhất."
            },
            {
                q: "The child was so hyperactive that his mother didn't let him out of her ________ for a second.",
                ans: "sight",
                idiom: "not let sb out of one's sight",
                vi: "không để ai rời khỏi tầm mắt, giám sát chặt chẽ",
                usage: "Dùng để diễn tả sự bảo vệ, trông coi vô cùng cẩn thận. Ngữ cảnh: Đứa trẻ quá hiếu động nên mẹ bé không dám rời mắt khỏi bé một giây nào."
            },
            {
                q: "The management decided to keep the employees in the ________ about the upcoming layoffs.",
                ans: "dark",
                idiom: "keep sb in the dark (about sth)",
                vi: "giữ bí mật, mù tịt thông tin, không cho ai biết điều gì",
                usage: "Hành động cố tình che giấu thông tin với ai đó. Ngữ cảnh: Ban quản lý quyết định giấu kín nhân viên về đợt sa thải sắp tới."
            }
        ];

        const encouragements = [
            "Hãy thử lại nhé, bạn làm được mà! 💪", 
            "Sai một ly đi một dặm, ôn kỹ lại cụm này nha! ✨", 
            "Gần đúng rồi, cố lên! 🎯", 
            "Chưa chính xác! Đọc kỹ phần giải thích để nhớ lâu hơn nhé! 🧠"
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const hintEl = document.getElementById("hint");
        const questionEl = document.getElementById("question");
        const dynamicAreaEl = document.getElementById("dynamic-area");
        const explanationEl = document.getElementById("explanation");
        const nextBtn = document.getElementById("next-btn");
        const scoreEl = document.getElementById("score");
        const currentQEl = document.getElementById("current-question");

        // Web Audio API
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.4);
            } else {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Bắt sự kiện Enter toàn cục để thao tác mượt mà
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const nextBtn = document.getElementById("next-btn");
                const submitBtn = document.getElementById("submit-btn");
                const resultScreen = document.getElementById("result-screen");
                
                if (resultScreen.style.display === "block") return;

                if (nextBtn.style.display === "block") {
                    event.preventDefault();
                    nextQuestion();
                } else if (submitBtn && submitBtn.style.display !== "none") {
                    event.preventDefault();
                    checkAnswer();
                }
            }
        });

        function initGame() {
            document.body.addEventListener('click', initAudio, { once: true });
            
            // Xáo trộn 21 câu hỏi
            currentQuestions = [...quizData].sort(() => Math.random() - 0.5);
            
            currentQuestionIndex = 0;
            score = 0;
            scoreEl.innerText = score;
            document.getElementById("quiz-screen").style.display = "block";
            document.getElementById("result-screen").style.display = "none";
            loadQuestion();
        }

        function loadQuestion() {
            nextBtn.style.display = "none";
            explanationEl.style.display = "none";
            explanationEl.className = "explanation-box";
            
            const item = currentQuestions[currentQuestionIndex];
            currentQEl.innerText = currentQuestionIndex + 1;

            // Hiển thị gợi ý
            hintEl.innerHTML = `💡 <b>Ý nghĩa cụm từ:</b> ${item.vi}`;

            // Hiển thị câu hỏi khuyết từ
            const formattedQ = item.q.replace("________", `<span style="color: #cbd5e1;">________</span>`);
            questionEl.innerHTML = formattedQ;

            // Render Input Box
            dynamicAreaEl.innerHTML = `
                <input type="text" id="answer-input" placeholder="Nhập 1 từ vào đây..." autocomplete="off">
                <button class="submit-btn" id="submit-btn" onclick="checkAnswer()">Kiểm tra ✔️</button>
            `;

            const inputEl = document.getElementById("answer-input");
            inputEl.focus();
        }

        function checkAnswer() {
            initAudio();
            const item = currentQuestions[currentQuestionIndex];
            const inputEl = document.getElementById("answer-input");
            const submitBtn = document.getElementById("submit-btn");
            
            const userAnswer = inputEl.value.trim().toLowerCase();
            const correctAnswer = item.ans.toLowerCase();

            if (userAnswer === "") {
                inputEl.style.animation = "shake 0.3s";
                setTimeout(() => inputEl.style.animation = "", 300);
                return;
            }

            inputEl.disabled = true;
            submitBtn.style.display = "none";

            let headerHTML = "";
            let encouragementText = "";

            if (userAnswer === correctAnswer) {
                score += 10;
                scoreEl.innerText = score;
                playSound('correct');
                explanationEl.classList.remove("wrong-bg");
                headerHTML = `<div class='exp-header correct-text'>🎉 Tuyệt vời! Bạn đã điền chính xác!</div>`;
                
                // Điền đáp án vào câu
                questionEl.innerHTML = item.q.replace("________", `<span style="color: #10b981; border-bottom: 3px solid #10b981; padding: 0 10px;">${item.ans}</span>`);
            } else {
                playSound('wrong');
                explanationEl.classList.add("wrong-bg");
                headerHTML = `<div class='exp-header wrong-text'>❌ Tiếc quá! Từ đúng phải là "${item.ans}"</div>`;
                
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                encouragementText = `<span class='encouragement'>${randomEncouragement}</span>`;

                // Điền đáp án đúng vào câu (màu đỏ)
                questionEl.innerHTML = item.q.replace("________", `<span style="color: #ef4444; border-bottom: 3px solid #ef4444; padding: 0 10px;">${item.ans}</span>`);
            }

            const expHTML = `
                ${headerHTML}
                ${encouragementText}
                <div class='exp-detail'>
                    <strong>🎯 ${item.idiom}</strong>
                    <div class="exp-usage">
                        <b>Cách dùng trong ngữ cảnh:</b><br>
                        ${item.usage}
                    </div>
                </div>
            `;
            
            explanationEl.innerHTML = expHTML;
            explanationEl.style.display = "block";
            nextBtn.style.display = "block";
            
            setTimeout(() => {
                nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                document.getElementById("quiz-screen").style.display = "none";
                document.getElementById("result-screen").style.display = "block";
                document.getElementById("final-score").innerText = score;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function restartGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
