<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary & Idiom Mastery 🌟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            --primary: #4f46e5; /* Indigo */
            --secondary: #f59e0b; /* Amber */
            --bg-color: #eef2ff;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --success-bg: #d1fae5;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --font-main: 'Nunito', sans-serif;
            --font-heading: 'Quicksand', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: 
                radial-gradient(circle at 10% 20%, #e0e7ff 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, #c7d2fe 0%, transparent 20%);
        }

        .game-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 850px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(79, 70, 229, 0.15);
            padding: 40px;
            border-top: 8px solid var(--primary);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            font-weight: 800;
            font-size: 1.2em;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: var(--font-heading);
        }

        .badge-area { margin-bottom: 20px; text-align: center; }
        
        .badge {
            display: inline-block;
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 0.9em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .badge-mcq { background-color: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
        .badge-fill { background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

        .instruction {
            text-align: center;
            font-size: 1.25em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .question-box {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 25px;
            border-radius: 16px;
            border: 2px solid #cbd5e1;
            font-family: var(--font-main);
            font-size: 1.6em;
            color: var(--primary);
            font-weight: 800;
            line-height: 1.5;
            background-color: #f8fafc;
        }

        .hint-text {
            display: block;
            margin-bottom: 15px;
            font-family: var(--font-main);
            font-size: 0.85em;
            color: var(--secondary);
            font-weight: 800;
            text-transform: none;
            letter-spacing: normal;
        }

        /* MCQ Styles */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background-color: #ffffff;
            border: 3px solid #cbd5e1;
            padding: 16px 20px;
            font-size: 1.2em;
            font-family: var(--font-main);
            color: var(--text-main);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 700;
            text-align: center;
        }

        .option-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.1);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background-color: #fef3c7;
            border-color: var(--secondary);
            color: #b45309;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
        }

        .option-btn.correct {
            background-color: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
            font-weight: 900;
        }

        .option-btn.wrong {
            background-color: var(--error-bg) !important;
            border-color: var(--error) !important;
            color: var(--error) !important;
            text-decoration: line-through;
        }

        /* Fill in Blank Styles */
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 70%;
            padding: 18px 25px;
            font-size: 1.5em;
            font-family: var(--font-main);
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            text-align: center;
            color: var(--primary);
            font-weight: 800;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(79, 70, 229, 0.2);
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 16px 55px;
            font-size: 1.25em;
            border-radius: 35px;
            cursor: pointer;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            display: block;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #3730a3;
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-next {
            background-color: var(--success);
            margin-top: 25px;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
        }

        .btn-next:hover { background-color: #047857; }

        /* Explanation Box */
        .explanation-box {
            display: none;
            background-color: #ffffff;
            border: 3px solid #e2e8f0;
            padding: 30px;
            margin-top: 25px;
            border-radius: 20px;
            color: var(--text-main);
            line-height: 1.6;
            animation: fadeIn 0.4s ease;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        .explanation-box.is-correct { border-left: 8px solid var(--success); border-color: var(--success); }
        .explanation-box.is-wrong { border-left: 8px solid var(--error); border-color: var(--error); }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #cbd5e1;
            font-size: 1.4em;
            font-weight: 900;
        }

        .audio-btn {
            background-color: var(--secondary);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.3em;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3);
        }

        .audio-btn:hover { background-color: #d97706; transform: scale(1.1); }

        .exp-content {
            background-color: var(--bg-body);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            font-size: 1.1em;
        }

        .exp-word {
            color: var(--primary);
            font-size: 1.6em;
            font-family: var(--font-heading);
            font-weight: 800;
        }

        .exp-meaning {
            display: block;
            margin: 15px 0;
            font-weight: 700;
            color: var(--text-main);
        }

        .usage-box {
            background-color: #fffbeb;
            padding: 15px;
            border-left: 4px solid var(--secondary);
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.95em;
        }

        .example-box {
            background-color: #ffffff;
            padding: 15px;
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            margin-top: 15px;
            font-style: italic;
            border: 1px solid #e2e8f0;
            border-left-color: var(--primary);
            font-size: 0.95em;
        }

        /* Result Screen */
        #result-screen { display: none; text-align: center; }
        #result-screen h2 { font-family: var(--font-heading); color: var(--primary); font-size: 3em; margin-bottom: 10px; }
        .final-score { font-size: 5em; font-weight: 900; color: var(--secondary); margin: 20px 0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="game-container" id="quiz-screen">
        <div class="header">
            <span>📚 CÂU HỎI: <span id="current-question">1</span>/30</span>
            <span>🏆 ĐIỂM: <span id="score">0</span></span>
        </div>

        <div class="badge-area" id="badge-area"></div>
        <div class="instruction" id="instruction">Loading...</div>
        <div class="question-box" id="question">Loading...</div>
        
        <div id="dynamic-area"></div>
        <div class="explanation-box" id="explanation"></div>
        <button class="btn-primary btn-next" id="next-btn" onclick="nextQuestion()">Tiếp Tục ➔</button>
    </div>

    <div class="game-container" id="result-screen">
        <h2>Xin Chúc Mừng! 🎓</h2>
        <p style="font-size: 1.3em; color: var(--text-muted); font-weight: 700;">Bạn đã hoàn thành bài kiểm tra Vocabulary & Idioms.</p>
        <div class="final-score"><span id="final-score"></span> / 300</div>
        <button class="btn-primary" onclick="restartGame()">Luyện Tập Lại 🔄</button>
    </div>

    <script>
        const quizData = [
            // MCQ (Từ câu hỏi bài 1)
            { type: "mcq", q: "They weren't _____ off by the terrible weather and continued with the race.", options: ["made", "stuck", "put", "got"], ans: "put", full: "put off", vi: "bị nản lòng bởi điều gì", ex: "They weren’t put off by the terrible weather.", usage: "Dùng khi nói bị nản lòng, mất đi sự hứng thú bởi điều gì đó. Cụm 'put off' đi với giới từ 'by'." },
            { type: "mcq", q: "He's _____ a shy person and rarely speaks in public.", options: ["fairly", "rather", "very", "pretty"], ans: "rather", full: "rather a shy person", vi: "khá là (nhấn mạnh mức độ)", ex: "He's rather a shy person.", usage: "'Rather' có thể đứng trước mạo từ 'a' để nhấn mạnh mức độ. 'Very' hay 'pretty' thường đứng sau 'a'." },
            { type: "mcq", q: "It's incredible that the plague wiped _____ nearly half of London's population.", options: ["by", "out", "over", "off"], ans: "out", full: "wipe out", vi: "xóa sạch, tiêu diệt hoàn toàn", ex: "The plague wiped out nearly half of London's population.", usage: "Phrasal verb 'wipe out' diễn tả sự hủy diệt, làm biến mất hoàn toàn một cái gì đó trên diện rộng." },
            { type: "mcq", q: "Ann's encouraging words gave me _____ to undertake the demanding task once again.", options: ["a point", "an incentive", "a resolution", "a target"], ans: "an incentive", full: "give an incentive", vi: "khích lệ ai đó", ex: "Her words gave me an incentive to try again.", usage: "Collocation cố định. Dùng khi đưa ra một sự khích lệ, động viên (về tinh thần hoặc vật chất) để ai đó làm gì." },
            { type: "mcq", q: "Betty says she cannot stand looking at the rat, _____ touching it.", options: ["even so", "let alone", "what if", "as far as"], ans: "let alone", full: "let alone", vi: "huống hồ, chưa nói đến", ex: "She can’t stand rats, let alone touch one.", usage: "Cụm từ được đặt sau một câu phủ định để nhấn mạnh rằng một việc tiếp theo thậm chí còn ít có khả năng xảy ra hơn việc vừa nói." },
            { type: "mcq", q: "Heavy _____ of wind have been hitting the west coast.", options: ["gales", "gusts", "hails", "breezes"], ans: "gusts", full: "gusts of wind", vi: "những cơn gió giật mạnh", ex: "Heavy gusts of wind have been hitting the west coast.", usage: "Collocation 'gusts of wind' chỉ những đợt gió thổi rất mạnh bất ngờ nhưng diễn ra trong thời gian ngắn." },
            { type: "mcq", q: "Markus took to skiing like a _____ to water.", options: ["fish", "duck", "boat", "shark"], ans: "duck", full: "take to something like a duck to water", vi: "dễ dàng, tự nhiên", ex: "He took to skiing like a duck to water.", usage: "Idiom chỉ việc ai đó học được một kỹ năng mới rất nhanh chóng, cảm thấy tự nhiên và giỏi ngay lập tức." },
            { type: "mcq", q: "Swimming is the best way to lose any weight you have _____ on in the winter.", options: ["added", "gained", "taken", "put"], ans: "put", full: "put on weight", vi: "tăng cân", ex: "She’s trying to lose the weight she put on.", usage: "Cụm động từ cố định 'put on weight' mang nghĩa là lên cân. Không dùng 'added' hay 'taken'." },
            { type: "mcq", q: "Can you imagine putting yourself _____ the pain of running a marathon?", options: ["through", "into", "in", "over"], ans: "through", full: "put someone through something", vi: "khiến ai trải qua điều gì", ex: "Could you imagine putting yourself through that pain?", usage: "Làm cho người khác hoặc chính mình phải chịu đựng một tình huống khó khăn, đau đớn về thể xác hoặc tinh thần." },
            { type: "mcq", q: "I have never played tennis on a grass _____. Have you?", options: ["pitch", "court", "field", "ground"], ans: "court", full: "tennis court", vi: "sân quần vợt", ex: "They played on a grass tennis court.", usage: "'Court' là danh từ chỉ sân chơi dành cho các môn thể thao như tennis, bóng rổ, cầu lông. (Pitch dùng cho bóng đá)." },
            { type: "mcq", q: "We decided to sign _____ for the trip to Ecuador and added our names to the list.", options: ["up", "on", "over", "in"], ans: "up", full: "sign up for", vi: "đăng ký tham gia", ex: "We decided to sign up for the trip.", usage: "Phrasal verb chỉ hành động ghi danh, đăng ký tên vào danh sách để tham gia sự kiện, khóa học, chuyến đi." },
            { type: "mcq", q: "Snowboarding started to _____ as a winter sport in the 1970s and 1980s but has become even more popular since then.", options: ["get out", "take off", "come out", "go off"], ans: "take off", full: "take off", vi: "trở nên nổi tiếng, phổ biến", ex: "Snowboarding took off in the 1970s.", usage: "Dùng để chỉ một sự việc, sản phẩm hoặc phong trào bỗng nhiên bùng nổ, trở nên rất thành công và phổ biến." },
            { type: "mcq", q: "When his father decided to retire, Jason took _____ the role of director.", options: ["after", "over", "off", "by"], ans: "over", full: "take over", vi: "tiếp quản, thay thế", ex: "Jason took over the role of director.", usage: "Nhận trách nhiệm, quyền điều hành hoặc vị trí của một người khác để lại." },
            { type: "mcq", q: "To _____ you the truth, I’m just not interested in that kind of music.", options: ["speak", "tell", "say", "give"], ans: "tell", full: "to tell the truth", vi: "nói thật lòng", ex: "To tell you the truth, I’m just not interested.", usage: "Thành ngữ 'to tell the truth' (thành thực mà nói) thường dùng ở đầu câu để thừa nhận điều gì đó." },
            { type: "mcq", q: "He said he had no _____ of applying for the manager’s position advertised.", options: ["reason", "potential", "intention", "choice"], ans: "intention", full: "have no intention of doing something", vi: "không có ý định làm gì", ex: "He had no intention of applying.", usage: "Collocation 'have no intention of + V-ing'. Khẳng định rằng mình không hề có dự định hoặc mong muốn làm một việc gì đó." },
            { type: "mcq", q: "Having access to running water and electricity is something many people _____ for granted these days.", options: ["take", "make", "get", "have"], ans: "take", full: "take something for granted", vi: "xem điều gì là hiển nhiên", ex: "We take running water for granted.", usage: "Hưởng thụ điều gì đó mà không biết trân trọng vì cho rằng nó luôn có sẵn và là lẽ dĩ nhiên." },
            { type: "mcq", q: "We didn’t believe that they had cooked the meal _____.", options: ["by their own", "on their own", "by themself", "on themselves"], ans: "on their own", full: "on one's own", vi: "tự mình", ex: "They cooked the meal on their own.", usage: "Làm một việc gì đó độc lập, không có sự trợ giúp từ ai khác. (Lưu ý: Không dùng 'by their own')." },
            { type: "mcq", q: "His style of playing tends to _____ to those who enjoy more traditional jazz.", options: ["delight", "appeal", "satisfy", "interest"], ans: "appeal", full: "appeal to someone", vi: "thu hút, hấp dẫn đối với ai", ex: "His style tends to appeal to traditional jazz fans.", usage: "Có sức hút, làm cho ai đó thấy thích thú hoặc quan tâm. Động từ 'appeal' luôn đi với giới từ 'to'." },
            { type: "mcq", q: "Beyond all _____, it was Alice who gave away our secrets.", options: ["fail", "conclusion", "dispute", "contradiction"], ans: "dispute", full: "beyond all dispute", vi: "không thể nghi ngờ", ex: "Beyond all dispute, Alice leaked our secrets.", usage: "Dùng để khẳng định một sự thật rành rành, hiển nhiên, chắc chắn đến mức không ai có thể cãi lại." },
            { type: "mcq", q: "According to the captain, his special units can take an immediate action against terrorists should such a need _____.", options: ["arise", "originate", "evoke", "experience"], ans: "arise", full: "should a need arise", vi: "nếu có nhu cầu phát sinh", ex: "They will act should a need arise.", usage: "Collocation: 'A need arises'. Dùng khi một vấn đề, nhu cầu hay tình huống bất ngờ nảy sinh, xuất hiện." },

            // FILL IN THE BLANK (IDIOMS - Đục lỗ chữ bôi vàng)
            { type: "fill", ans: "sound", full: "as sound as a bell", phrase: "as ________ as a bell", vi: "Khỏe mạnh, tráng kiện, phong độ tốt", ex: "After the treatment, he felt as sound as a bell.", usage: "Dùng để miêu tả tình trạng sức khỏe thể chất hoặc tinh thần hoàn hảo. Tương đương: 'as fit as a fiddle', 'in the pink'." },
            { type: "fill", ans: "drum", full: "beat the drum for", phrase: "beat the ________ for", vi: "Cổ vũ, tuyên truyền, vận động mạnh mẽ cho", ex: "She has been beating the drum for environmental protection.", usage: "Tích cực kêu gọi sự ủng hộ hoặc quảng bá cho một vấn đề, mục tiêu nào đó. Tương đương: 'champion a cause'." },
            { type: "fill", ans: "tune", full: "dance to someone's tune", phrase: "dance to someone's ________", vi: "Ngoan ngoãn nghe lời, bảo sao nghe vậy", ex: "The manager expects everyone to dance to his tune.", usage: "Bị điều khiển, làm theo mọi yêu cầu vô lý của người khác. Tương đương: 'be at someone's beck and call'." },
            { type: "fill", ans: "music", full: "face the music", phrase: "face the ________", vi: "Chấp nhận hình phạt, đối mặt với hậu quả", ex: "After failing the test, he had to face the music from his parents.", usage: "Chấp nhận những lời chỉ trích, hậu quả cho những sai lầm mình đã gây ra. Tương đương: 'bite the bullet'." },
            { type: "fill", ans: "song", full: "for a song", phrase: "for a ________", vi: "Giá rẻ mạt, giá rẻ như cho", ex: "I bought this antique vase for a song at the local market.", usage: "Mua được một món đồ với mức giá cực kỳ rẻ, thấp hơn rất nhiều so với giá trị thực. Tương đương: 'dirt cheap'." },
            { type: "fill", ans: "dance", full: "lead someone a merry dance", phrase: "lead someone a merry ________", vi: "Làm ai đó khốn đốn, vất vả chạy vạy, dắt mũi ai", ex: "The suspect led the police a merry dance before finally being caught.", usage: "Gây ra rắc rối, làm ai đó tốn công vô ích tìm kiếm hoặc giải quyết vấn đề. Tương đương: 'lead someone up the garden path'." },
            { type: "fill", ans: "fiddle", full: "play second fiddle to", phrase: "play second ________ to", vi: "Đóng vai phụ, lép vế, xếp sau ai đó", ex: "She's tired of playing second fiddle to her older sister.", usage: "Giữ một vị trí kém quan trọng hơn, bị lu mờ bởi thành công của người khác. Tương đương: 'take a back seat'." },
            { type: "fill", ans: "bell", full: "ring a bell", phrase: "ring a ________", vi: "Nghe quen quen, gợi nhớ đến cái gì", ex: "His name rings a bell, but I can't place his face.", usage: "Một cái tên, âm thanh hay sự kiện gợi lên cảm giác quen thuộc nhưng bạn không nhớ rõ ràng chi tiết. Tương đương: 'jog someone's memory'." },
            { type: "fill", ans: "chord", full: "strike a chord with", phrase: "strike a ________ with", vi: "Chạm đúng tâm lý, tạo sự đồng cảm sâu sắc", ex: "The speaker's message struck a chord with the young audience.", usage: "Gợi lên cảm xúc mạnh mẽ, khiến người nghe thấy thân thuộc và đồng cảm. Tương đương: 'hit home', 'touch a nerve'." },
            { type: "fill", ans: "note", full: "hit the right note", phrase: "hit the right ________", vi: "Nói/làm đúng lúc, hợp lòng người, tạo hiệu ứng tốt", ex: "Her speech hit the right note and everyone cheered.", usage: "Thực hiện một hành động hoặc nói một câu cực kỳ phù hợp với tình huống. Tương đương: 'hit the nail on the head'." }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionText = null;
        let selectedOptionBtn = null;

        const questionEl = document.getElementById("question");
        const dynamicAreaEl = document.getElementById("dynamic-area");
        const explanationEl = document.getElementById("explanation");
        const nextBtn = document.getElementById("next-btn");
        const scoreEl = document.getElementById("score");
        const currentQEl = document.getElementById("current-question");
        const badgeAreaEl = document.getElementById("badge-area");
        const instructionEl = document.getElementById("instruction");

        // Audio Setup
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(isCorrect) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (isCorrect) {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime); 
                oscillator.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.1); 
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(250, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            }
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        // LỌC TỪ THỪA KHI ĐỌC (Ẩn sth, sb, someone, something, one's, (doing sth))
        function cleanTextForSpeech(text) {
            return text.replace(/\bsomeone\b|\bsomething\b|\bsb\b|\bsth\b|\bone's\b|\(doing sth\)/gi, '')
                       .replace(/\s+/g, ' ')
                       .trim();
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = cleanTextForSpeech(text);
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US'; 
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const resultScreen = document.getElementById("result-screen");
                if (resultScreen.style.display === "block") return;

                if (nextBtn.style.display === "block") {
                    event.preventDefault();
                    nextQuestion();
                } else {
                    const submitBtn = document.getElementById("submit-btn");
                    if (submitBtn && submitBtn.style.display !== "none" && !submitBtn.disabled) {
                        event.preventDefault();
                        currentQuestions[currentQuestionIndex].type === "mcq" ? checkMCQ() : checkFill();
                    }
                }
            }
        });

        function initGame() {
            document.body.addEventListener('click', initAudio, { once: true });
            currentQuestions = [...quizData].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;
            scoreEl.innerText = score;
            document.getElementById("quiz-screen").style.display = "block";
            document.getElementById("result-screen").style.display = "none";
            loadQuestion();
        }

        function loadQuestion() {
            nextBtn.style.display = "none";
            explanationEl.style.display = "none";
            dynamicAreaEl.innerHTML = "";
            selectedOptionText = null;
            selectedOptionBtn = null;
            
            const item = currentQuestions[currentQuestionIndex];
            currentQEl.innerText = currentQuestionIndex + 1;

            if (item.type === "mcq") {
                badgeAreaEl.innerHTML = `<span class="badge badge-mcq">NGỮ PHÁP & TỪ VỰNG (MCQ)</span>`;
                instructionEl.innerText = "Chọn từ tiếng Anh có nghĩa và cách dùng phù hợp với câu sau:";
                questionEl.innerHTML = item.q;

                const optionsContainer = document.createElement('div');
                optionsContainer.className = "options-grid";
                
                item.options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerText = opt;
                    if(opt === item.ans) btn.dataset.correct = "true";
                    btn.onclick = () => {
                        initAudio();
                        const allBtns = optionsContainer.querySelectorAll('.option-btn');
                        allBtns.forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedOptionText = opt;
                        selectedOptionBtn = btn;
                        
                        const submitBtn = document.getElementById("submit-btn");
                        if(submitBtn) submitBtn.disabled = false;
                    };
                    optionsContainer.appendChild(btn);
                });
                dynamicAreaEl.appendChild(optionsContainer);
                
                const submitDiv = document.createElement('div');
                submitDiv.innerHTML = `<button class="btn-primary" id="submit-btn" onclick="checkMCQ()" disabled>Kiểm tra</button>`;
                dynamicAreaEl.appendChild(submitDiv);

            } else {
                badgeAreaEl.innerHTML = `<span class="badge badge-fill">THÀNH NGỮ (ĐIỀN TỪ)</span>`;
                instructionEl.innerText = "Điền MỘT từ vào chỗ trống để tạo thành Idiom hoàn chỉnh:";
                
                const formattedQ = item.phrase.replace("________", `<span style="color: var(--text-muted); border-bottom: 2px dashed var(--text-muted); padding: 0 30px;">?</span>`);
                questionEl.innerHTML = `<span class="hint-text">💡 Nghĩa Idiom: ${item.vi}</span> ${formattedQ}`;

                dynamicAreaEl.innerHTML = `
                    <div class="input-group">
                        <input type="text" id="blank-input" placeholder="Gõ từ cần điền..." autocomplete="off">
                        <button class="btn-primary" id="submit-btn" onclick="checkFill()">Kiểm tra</button>
                    </div>
                `;
                setTimeout(() => {
                    const inp = document.getElementById("blank-input");
                    if(inp) inp.focus();
                }, 100);
            }
        }

        function checkMCQ() {
            if (!selectedOptionText) return;

            initAudio();
            const item = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => btn.disabled = true);
            document.getElementById("submit-btn").style.display = "none";

            let isCorrect = selectedOptionText === item.ans;
            let headerHTML = "";

            if (isCorrect) {
                selectedOptionBtn.classList.remove("selected");
                selectedOptionBtn.classList.add("correct");
                score += 10;
                scoreEl.innerText = score;
                playSound(true);
                explanationEl.className = "explanation-box is-correct";
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--success);">🎉 Chính xác!</span>
                        <button class='audio-btn' onclick="speakWord('${item.full.replace(/'/g, "\\'")}')">🔊</button>
                    </div>`;
            } else {
                selectedOptionBtn.classList.remove("selected");
                selectedOptionBtn.classList.add("wrong");
                buttons.forEach(btn => {
                    if(btn.dataset.correct === "true") btn.classList.add("correct");
                });
                playSound(false);
                explanationEl.className = "explanation-box is-wrong";
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--error);">❌ Đáp án đúng: <b>${item.ans}</b></span>
                        <button class='audio-btn' onclick="speakWord('${item.full.replace(/'/g, "\\'")}')">🔊</button>
                    </div>`;
            }

            speakWord(item.full);

            const expHTML = `
                ${headerHTML}
                <div class='exp-content'>
                    <span class='exp-word'>${item.full}</span>
                    <div class="usage-box">
                        <b>Nghĩa & Giải thích:</b> ${item.vi}.<br> ${item.usage}
                    </div>
                </div>
            `;
            
            explanationEl.innerHTML = expHTML;
            explanationEl.style.display = "block";
            nextBtn.style.display = "block";
            setTimeout(() => { nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        }

        function checkFill() {
            initAudio();
            const item = currentQuestions[currentQuestionIndex];
            const inputEl = document.getElementById("blank-input");
            const submitBtn = document.getElementById("submit-btn");

            const userAns = inputEl.value.trim().toLowerCase();
            const correctAns = item.ans.toLowerCase();

            if (userAns === "") return;

            inputEl.disabled = true;
            submitBtn.style.display = "none";

            let isCorrect = userAns === correctAns;
            let headerHTML = "";

            if (isCorrect) {
                score += 10;
                scoreEl.innerText = score;
                playSound(true);
                explanationEl.className = "explanation-box is-correct";
                questionEl.innerHTML = `<span class="hint-text">💡 Nghĩa: ${item.vi}</span>` + item.phrase.replace("________", `<span style="color: var(--success); border-bottom: 2px solid var(--success); padding: 0 10px;">${item.ans}</span>`);
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--success);">🎉 Giỏi quá!</span>
                        <button class='audio-btn' onclick="speakWord('${item.full.replace(/'/g, "\\'")}')">🔊</button>
                    </div>`;
            } else {
                playSound(false);
                explanationEl.className = "explanation-box is-wrong";
                questionEl.innerHTML = `<span class="hint-text">💡 Nghĩa: ${item.vi}</span>` + item.phrase.replace("________", `<span style="color: var(--error); text-decoration: line-through;">${userAns}</span> <span style="color: var(--success);">${item.ans}</span>`);
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--error);">❌ Từ cần điền là: <b>${item.ans}</b></span>
                        <button class='audio-btn' onclick="speakWord('${item.full.replace(/'/g, "\\'")}')">🔊</button>
                    </div>`;
            }

            speakWord(item.full);

            const expHTML = `
                ${headerHTML}
                <div class='exp-content'>
                    <span class='exp-word'>${item.full}</span>
                    <div class="usage-box">
                        <b>Giải thích ngữ cảnh:</b> ${item.usage}
                    </div>
                    <div class="example-box">
                        <b>Ví dụ:</b> "${item.ex}"
                    </div>
                </div>
            `;
            
            explanationEl.innerHTML = expHTML;
            explanationEl.style.display = "block";
            nextBtn.style.display = "block";
            setTimeout(() => { nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById("quiz-screen").style.display = "none";
                document.getElementById("result-screen").style.display = "block";
                document.getElementById("final-score").innerText = score;
            }
        }

        function restartGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
